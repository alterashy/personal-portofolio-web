<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Smooth 4-Color Gradient for the Deck Foundation (Cyan -> Emerald -> Amber -> Orange) -->
    <linearGradient id="deck-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />   <!-- Cyan -->
      <stop offset="33%" stop-color="#10B981" />  <!-- Emerald -->
      <stop offset="66%" stop-color="#F59E0B" />  <!-- Amber -->
      <stop offset="100%" stop-color="#F97316" /> <!-- Orange -->
    </linearGradient>
  </defs>

  <!-- Outer Layer: Sharp Reticle Corners with Square Cap Ends -->
  <g stroke-width="1" stroke-linecap="square" fill="none">
    <!-- Top-Left Corner: Cyan -->
    <path d="M 2 6 V 2 H 6" stroke="#06B6D4" />
    <!-- Top-Right Corner: Amber -->
    <path d="M 26 2 H 30 V 6" stroke="#F59E0B" />
    <!-- Bottom-Left Corner: Orange -->
    <path d="M 2 26 V 30 H 6" stroke="#F97316" />
    <!-- Bottom-Right Corner: Emerald -->
    <path d="M 30 26 V 30 H 26" stroke="#10B981" />
  </g>

  <!-- Central Lettermark: Minimalist Geometric Delta "A" -->
  <!-- Base spans exactly x=6 to x=26 (width=20), perfectly matching the deck chassis below -->
  <path id="lettermark-a" fill="#F8FAFC" fill-rule="evenodd" d="M 16 5 L 26 21 H 6 Z M 16 11 L 20 18 H 12 Z" />

  <!-- The "Deck" Foundation: Perfectly Aligned Deck Chassis with Sharp Corners (rx=0) -->
  <!-- Spans x=6 to x=26 (width=20), directly aligned with triangle base above -->
  <rect id="deck-chassis" x="6" y="23" width="20" height="4" rx="0" fill="url(#deck-gradient)" />
</svg>
